<div class="hero-container relative h-screen w-full overflow-hidden flex items-center justify-center select-none">
  <!-- Vídeo Background em Loop -->
  <video
    #heroVideo
    autoplay
    loop
    muted
    [muted]="isMuted()"
    playsinline
    preload="metadata"
    class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"
    [poster]="posterUrl || 'assets/images/hero-poster.jpg'"
  >
    <source [src]="videoUrl || 'assets/videos/wb-presentation.mp4'" type="video/mp4">
  </video>

  <!-- Overlay Leve Editorial -->
  <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-[#FBFBF9]/80 z-10 pointer-events-none"></div>

  <!-- CONTAINER CENTRAL: APENAS O SPLASH TEMPORIZADO (SEM BOTÕES) -->
  <div class="relative z-20 flex items-center justify-center w-full h-full pointer-events-none px-6">
    <div 
      *ngIf="showSplashLogo()"
      class="animate-fade-splash flex items-center justify-center"
    >
      <!-- Logo com fundo transparente, proporcional à tela (sem esticar ou cortar) -->
      <img 
        src="assets/images/logo-wb-agency-light.png" 
        alt="WB Agency" 
        class="w-auto h-auto max-h-[22vh] max-w-[70vw] sm:max-h-[26vh] sm:max-w-[60vw] md:max-h-[32vh] md:max-w-[50vw] object-contain drop-shadow-md bg-transparent"
      />
    </div>
  </div>

  <!-- Controlo de Áudio Editorial (Mute/Unmute) -->
  <button
    type="button"
    class="audio-toggle-btn"
    (click)="toggleAudio()"
    [attr.aria-label]="isMuted() ? 'Ativar som' : 'Desativar som'"
    [attr.aria-pressed]="!isMuted()"
  >
    <span class="audio-icon-wrapper" aria-hidden="true">
      @if (isMuted()) {
        <svg class="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      } @else {
        <svg class="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      }
    </span>
    <span class="audio-label tracking-editorial">{{ isMuted() ? 'SOUND OFF' : 'SOUND ON' }}</span>
  </button>

  <!-- Indicador de Rolagem Elegante -->
  <button 
    type="button" 
    class="scroll-down-btn" 
    (click)="scrollToContent()" 
    aria-label="Rolar para os destaques">
    <span class="mouse-icon">
      <span class="mouse-wheel"></span>
    </span>
    <span class="scroll-text tracking-editorial">SCROLL</span>
  </button>

  <!-- ============================================================
       🌟 JANELA SOBREPOSTA AO HERO (COMUNICADO / AVISO EM DESTAQUE)
       Ocupa a janela de forma preferencial, harmonicamente e em destaque
       ============================================================ -->
  <div *ngIf="content?.disclaimerActive && showDisclaimerModal && content?.disclaimerText" 
       class="disclaimer-overlay fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 md:p-10 bg-black/65 backdrop-blur-md animate-fade-in"
       role="dialog"
       aria-modal="true"
       aria-labelledby="disclaimer-modal-title">

    <div class="disclaimer-window relative w-full max-w-2xl bg-[#1B1E1C]/95 text-white border-2 border-[#C2A87E]/80 shadow-[0_25px_60px_rgba(0,0,0,0.5)] p-6 sm:p-10 rounded-none overflow-hidden"
         (click)="$event.stopPropagation()">

      <!-- Faixa Dourada Superior -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#8E7954] via-[#C2A87E] to-[#8E7954]"></div>

      <!-- Botão Fechar no Canto Superior -->
      <button 
        type="button" 
        (click)="showDisclaimerModal = false" 
        class="absolute top-4 right-4 sm:top-6 sm:right-6 w-8 h-8 flex items-center justify-center text-neutral-400 hover:text-white hover:bg-white/10 transition-colors rounded-none cursor-pointer" 
        aria-label="Fechar Aviso">
        ✕
      </button>

      <!-- Badge Editorial -->
      <div class="inline-flex items-center gap-2 px-2.5 py-1 bg-[#C2A87E]/15 border border-[#C2A87E]/40 text-[#C2A87E] text-[10px] tracking-[0.25em] uppercase font-sans font-medium mb-4 rounded-none">
        <span class="w-1.5 h-1.5 bg-[#C2A87E]"></span>
        <span>Comunicado Oficial • WB Agency</span>
      </div>

      <!-- Título do Comunicado -->
      <h3 id="disclaimer-modal-title" class="font-serif text-xl sm:text-2xl md:text-3xl text-white tracking-wide uppercase leading-tight mb-4">
        {{ content?.disclaimerTitle || 'Aviso Importante' }}
      </h3>

      <!-- Texto do Comunicado -->
      <div class="text-sm sm:text-base text-neutral-200 leading-relaxed font-sans font-light mb-8 whitespace-pre-line border-l-2 border-[#C2A87E]/40 pl-4 py-1">
        {{ content?.disclaimerText }}
      </div>

      <!-- Ações: Botão de Prosseguir -->
      <div class="flex items-center justify-end pt-4 border-t border-neutral-700/60">
        <button 
          type="button" 
          (click)="showDisclaimerModal = false" 
          class="w-full sm:w-auto px-6 py-3 bg-[#4B584E] hover:bg-[#38433B] text-white text-xs uppercase tracking-[0.2em] font-medium transition-all rounded-none cursor-pointer text-center shadow-md">
          Prosseguir para o Site
        </button>
      </div>

    </div>
  </div>
</div>
