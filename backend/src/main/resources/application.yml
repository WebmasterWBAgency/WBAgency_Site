server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  # Obrigatorio Render + Cloudflare: Spring le corretamente os headers X-Forwarded-Host,
  # X-Forwarded-Proto e X-Forwarded-Prefix (necessario para CORS e redirects absolutos).
  forward-headers-strategy: native

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 50MB

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${DB_USER:postgres.PROJECT_REF}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WbAgencyHikariPool
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false

  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: ${SPRING_MAIL_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${SPRING_MAIL_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:10000}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:d2Itc2NvdXRpbmctYWdlbmN5LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktMjU2Yml0cw==}
      expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    admin-webmaster:
      name: ${APP_SECURITY_ADMIN_WEBMASTER_NAME:Webmaster WB Agency}
      email: ${APP_SECURITY_ADMIN_WEBMASTER_EMAIL:webmaster@wbagency.com.br}
      password: "${APP_SECURITY_ADMIN_WEBMASTER_PASSWORD:}"
      role: WEBMASTER
      must-change-password: ${APP_SECURITY_ADMIN_WEBMASTER_MUST_CHANGE_PASSWORD:false}
    admin-info:
      name: ${APP_SECURITY_ADMIN_INFO_NAME:Administrativo WB Agency}
      email: ${APP_SECURITY_ADMIN_INFO_EMAIL:info@wbagency.com.br}
      password: "${APP_SECURITY_ADMIN_INFO_PASSWORD:}"
      role: ADMIN
      must-change-password: ${APP_SECURITY_ADMIN_INFO_MUST_CHANGE_PASSWORD:false}
    # fallback legacy (compatibilidade com versoes antigas)
    initial-admin:
      email: ${APP_SECURITY_INITIAL_ADMIN_EMAIL:webmaster@wbagency.com.br}
      password: "${APP_SECURITY_INITIAL_ADMIN_PASSWORD:}"
      name: ${APP_SECURITY_INITIAL_ADMIN_NAME:Webmaster WB Agency}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://wbagency.com.br,https://www.wbagency.com.br}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: true
    max-age: 3600
  mail:
    from-address: ${APP_MAIL_FROM_ADDRESS:no-reply@wbagency.com.br}
    from-name: ${APP_MAIL_FROM_NAME:WB Agency}
    agency-notification-email: ${APP_MAIL_AGENCY_NOTIFICATION:info@wbagency.com.br}
    reset-password-base-url: ${APP_MAIL_RESET_BASE_URL:http://localhost:4200/admin/reset-password}

supabase:
  url: ${SUPABASE_URL:https://dummy-project.supabase.co}
  key: ${SUPABASE_KEY:dummy-key}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:dummy-key}
  anon-key: ${SUPABASE_ANON_KEY:dummy-key}
  storage:
    local-fallback: ${SUPABASE_STORAGE_LOCAL_FALLBACK:false}
    local-dir: ${SUPABASE_STORAGE_LOCAL_DIR:uploads-local}

logging:
  level:
    com.wbscouting.api: INFO

# ============================================================
# ACTUATOR (Render Load Balancer Health Check)
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      status:
        order: DOWN, OUT_OF_SERVICE, UP, UNKNOWN
  server:
    port: ${PORT:8080}
  info:
    build:
      enabled: true