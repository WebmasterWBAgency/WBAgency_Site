# fly.toml app configuration file generated for backend-honeyed-blossom-771 on 2026-10-10T10:24:55-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-honeyed-blossom-771'
primary_region = 'gru'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "45s"
  interval = "15s"
  method = "GET"
  path = "/api/v1/public/models"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1