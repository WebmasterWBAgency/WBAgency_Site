# fly.toml app configuration file generated for backend-honeyed-blossom-771 on 2026-10-10T10:24:55-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-honeyed-blossom-771'
primary_region = 'gru'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "40s"
  interval = "15s"
  method = "GET"
  path = "/api/v1/public/models"
  timeout = "5s"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
