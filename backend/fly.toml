# fly.toml app configuration file generated for backend-honeyed-blossom-771 on 2026-10-10T10:24:55-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# fly.toml
app = "backend-honeyed-blossom-771"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  SPRING_PROFILES_ACTIVE = "prod"
  JAVA_OPTS = "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "120s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/api/v1/actuator/health/liveness"

[deploy]
  strategy = "bluegreen"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"